<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrito | TuxAudifonos</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/shop.css"></head><body>
<header class="navbar"><a class="brand" href="/"><span class="brand-mark">t</span> tuxaudifonos</a><nav class="main-nav"><a href="/">Audífonos</a><a href="/pedidos">Mis pedidos</a></nav><div class="nav-actions"><a class="bag-link" href="/carrito">Carrito <span id="cart-count">0</span></a></div></header>
<main class="shop-main"><div class="shop-head"><p class="eyebrow">TU SELECCIÓN</p><h1>Tu carrito.</h1><p class="muted">Revisa tus productos y ajusta las cantidades antes de continuar.</p></div><div id="cart-content"></div></main>
<script>
const money = (n) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(n || 0));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CART_KEY = 'tux_carrito_v2';
const leer = () => { try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch { return []; } };
const guardar = (items) => { localStorage.setItem(CART_KEY, JSON.stringify(items)); render(); };
function render() {
  const items = leer();
  document.getElementById('cart-count').textContent = items.reduce((n, x) => n + x.cantidad, 0);
  const root = document.getElementById('cart-content');
  if (!items.length) { root.innerHTML = '<div class="empty-box"><h2>Tu carrito está vacío.</h2><p class="muted">Explora la colección y agrega los audífonos que te gusten.</p><a class="primary-button" href="/" style="max-width:260px;margin:18px auto 0">Explorar audífonos</a></div>'; return; }
  let total = 0;
  const filas = items.map((x, i) => { const sub = Number(x.precio) * x.cantidad; total += sub;
    return `<article class="cart-row">${x.imagen ? `<img src="${esc(x.imagen)}" alt="${esc(x.nombre)}">` : '<div></div>'}<div><h3>${esc(x.nombre)}</h3><p>${money(x.precio)} por pieza</p><div class="qty"><button data-a="menos" data-i="${i}" aria-label="Restar">−</button><strong>${x.cantidad}</strong><button data-a="mas" data-i="${i}" aria-label="Sumar">＋</button><button class="remove" data-a="quitar" data-i="${i}">Eliminar</button></div></div><strong class="cart-price">${money(sub)}</strong></article>`; }).join('');
  const envio = total >= 1500 ? 0 : 99;
  root.innerHTML = `<div class="shop-grid"><section class="shop-panel"><h2>Productos (${items.reduce((n, x) => n + x.cantidad, 0)})</h2>${filas}</section><aside class="shop-panel"><h2>Resumen de compra</h2><div class="total-line"><span>Subtotal</span><strong>${money(total)}</strong></div><div class="total-line"><span>Envío</span><strong>${envio ? money(envio) : 'Gratis'}</strong></div><div class="total-line total"><span>Total</span><strong>${money(total + envio)}</strong></div><p class="muted">${total < 1500 ? 'Envío gratis desde $1,500.' : ''} El precio final y las existencias se validan al confirmar.</p><a class="primary-button" href="/checkout">Continuar al envío</a><a class="secondary-button" href="/" style="width:100%;margin-top:10px">Seguir comprando</a></aside></div>`;
  root.querySelectorAll('button[data-a]').forEach((b) => b.onclick = () => {
    const it = leer(); const i = Number(b.dataset.i); const x = it[i];
    if (b.dataset.a === 'quitar') it.splice(i, 1);
    else if (b.dataset.a === 'mas') x.cantidad = Math.min(20, x.existencias, x.cantidad + 1);
    else x.cantidad = Math.max(1, x.cantidad - 1);
    guardar(it);
  });
}
render();
</script></body></html>
