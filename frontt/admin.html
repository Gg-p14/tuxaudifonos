<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/shop.css"><title>Administración | TuxAudifonos</title></head><body>
<header class="navbar"><a class="brand" href="/"><span class="brand-mark">t</span> tuxaudifonos</a><nav class="main-nav"><a href="/">Audífonos</a><a href="/admin">Administración</a><a href="/perfil">Mi cuenta</a></nav></header>
<main class="shop-main"><div class="shop-head"><p class="eyebrow">PANEL DE ADMINISTRADOR</p><h1>Administración.</h1></div><div id="msg" class="notice hidden"></div>
<section class="shop-panel"><h2>Resumen</h2><div id="resumen"></div></section>
<section class="shop-panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0">Productos</h2><button id="nuevo" class="primary-button" style="width:auto;margin:0;padding:10px 18px">Nuevo producto</button></div><div id="productos" style="margin-top:14px"></div></section>
<section class="shop-panel" id="form-box" style="display:none"><h2 id="form-titulo">Nuevo producto</h2><form id="prod-form" class="form-grid">
  <div class="field full"><label for="nombre">Nombre</label><input id="nombre" name="nombre" required minlength="2" maxlength="100"></div>
  <div class="field"><label for="id_marca">Marca</label><select id="id_marca" name="id_marca" required></select></div>
  <div class="field"><label for="id_categoria">Categoría</label><select id="id_categoria" name="id_categoria" required></select></div>
  <div class="field"><label for="precio">Precio</label><input id="precio" name="precio" type="number" step="0.01" min="0.01" required></div>
  <div class="field"><label for="precio_anterior">Precio anterior (opcional)</label><input id="precio_anterior" name="precio_anterior" type="number" step="0.01" min="0.01"></div>
  <div class="field"><label for="existencias">Existencias</label><input id="existencias" name="existencias" type="number" min="0" required></div>
  <div class="field"><label for="bateria_horas">Batería en horas (opcional)</label><input id="bateria_horas" name="bateria_horas" type="number" min="1" max="200"></div>
  <div class="field full"><label for="imagen">URL de la imagen (opcional)</label><input id="imagen" name="imagen" type="url"></div>
  <div class="field full"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion" rows="3" maxlength="1000"></textarea></div>
  <div class="field full"><label><input type="checkbox" id="cancelacion_ruido" name="cancelacion_ruido" style="width:auto"> Cancelación de ruido</label> <label><input type="checkbox" id="destacado" name="destacado" style="width:auto"> Destacado</label></div>
  <div class="field full"><button class="primary-button" type="submit">Guardar producto</button><button type="button" id="cancelar-form" class="secondary-button" style="width:100%;margin-top:10px">Cancelar</button></div></form></section>
<section class="shop-panel"><h2>Pedidos</h2><div id="pedidos"></div></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const money = (n) => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(Number(n || 0));
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const folio = (id) => "TUX-" + String(id).padStart(6, "0");
const ESTADOS = ["Comprada", "En preparación", "Enviado", "Entregado", "Cancelada"];
async function api(url, opts = {}) { const r = await fetch("/api" + url, { credentials: "same-origin", ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(Array.isArray(d.detail) ? d.detail.map((x) => x.msg).join(". ") : (d.detail || "Ocurrió un error.")); return d; }
const aviso = (t, err) => { const m = $("#msg"); m.textContent = t; m.className = "notice" + (err ? "" : " ok"); m.classList.remove("hidden"); };
let catalogos = { categorias: [], marcas: [] };
let editando = null;

(async () => {
  let u; try { u = (await api("/auth/me")).usuario; } catch {}
  if (!u || u.rol !== "admin") { location.href = "/iniciar-sesion?next=/admin"; return; }
  catalogos = await api("/categorias");
  $("#id_marca").innerHTML = catalogos.marcas.map((m) => `<option value="${m.id_marca}">${esc(m.nombre)}</option>`).join("");
  $("#id_categoria").innerHTML = catalogos.categorias.map((c) => `<option value="${c.id_categoria}">${esc(c.nombre)}</option>`).join("");
  cargarTodo();
})();
function cargarTodo() { cargarResumen(); cargarProductos(); cargarPedidos(); }

async function cargarResumen() {
  try { const r = await api("/admin/resumen"); $("#resumen").innerHTML = Object.entries(r).map(([k, v]) => `<div class="total-line"><span>${esc(k.replace(/_/g, " "))}</span><strong>${esc(typeof v === "number" && k.includes("total") ? money(v) : v)}</strong></div>`).join(""); }
  catch (e) { $("#resumen").innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}
async function cargarProductos() {
  try {
    const items = await api("/admin/audifonos");
    $("#productos").innerHTML = items.length ? items.map((p) => `<div class="total-line" style="align-items:center"><span><strong>${esc(p.nombre)}</strong><br><span class="muted">${esc(p.marca)} · ${esc(p.categoria)} · ${money(p.precio)} · ${p.existencias} en existencias${p.activo === 0 || p.activo === false ? " · (inactivo)" : ""}</span></span><span><button class="small-button" data-e="${p.id_audifono}">Editar</button> <button class="remove" data-d="${p.id_audifono}">Desactivar</button></span></div>`).join("") : '<p class="muted">Aún no hay productos.</p>';
    $("#productos").querySelectorAll("[data-e]").forEach((b) => b.onclick = () => abrirEditar(items.find((x) => x.id_audifono === Number(b.dataset.e))));
    $("#productos").querySelectorAll("[data-d]").forEach((b) => b.onclick = async () => { if (!confirm("¿Desactivar este producto?")) return; try { await api("/admin/audifonos/" + b.dataset.d, { method: "DELETE" }); aviso("Producto desactivado."); cargarProductos(); } catch (e) { aviso(e.message, true); } });
  } catch (e) { $("#productos").innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}
function abrirFormulario(titulo) { $("#form-titulo").textContent = titulo; $("#form-box").style.display = ""; $("#form-box").scrollIntoView({ behavior: "smooth" }); }
$("#nuevo").onclick = () => { editando = null; $("#prod-form").reset(); abrirFormulario("Nuevo producto"); };
$("#cancelar-form").onclick = () => { $("#form-box").style.display = "none"; };
function abrirEditar(p) {
  editando = p;
  const f = $("#prod-form");
  f.nombre.value = p.nombre; f.precio.value = p.precio; f.precio_anterior.value = p.precio_anterior || ""; f.existencias.value = p.existencias;
  f.bateria_horas.value = p.bateria_horas || ""; f.imagen.value = p.imagen || ""; f.descripcion.value = p.descripcion || "";
  f.cancelacion_ruido.checked = !!p.cancelacion_ruido; f.destacado.checked = !!p.destacado;
  if (p.id_marca) f.id_marca.value = p.id_marca;
  if (p.id_categoria) f.id_categoria.value = p.id_categoria;
  abrirFormulario("Editar producto");
}
$("#prod-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const datos = {
    nombre: f.nombre.value.trim(), id_marca: Number(f.id_marca.value), id_categoria: Number(f.id_categoria.value),
    precio: Number(f.precio.value), precio_anterior: f.precio_anterior.value ? Number(f.precio_anterior.value) : null,
    existencias: Number(f.existencias.value), bateria_horas: f.bateria_horas.value ? Number(f.bateria_horas.value) : null,
    imagen: f.imagen.value.trim() || null, descripcion: f.descripcion.value.trim(),
    cancelacion_ruido: f.cancelacion_ruido.checked, destacado: f.destacado.checked,
  };
  try {
    if (editando) await api("/admin/audifonos/" + editando.id_audifono, { method: "PUT", body: JSON.stringify(datos) });
    else await api("/admin/audifonos", { method: "POST", body: JSON.stringify(datos) });
    $("#form-box").style.display = "none"; aviso("Producto guardado."); cargarTodo();
  } catch (err) { aviso(err.message, true); }
});

async function cargarPedidos() {
  try {
    const pedidos = await api("/admin/pedidos");
    $("#pedidos").innerHTML = pedidos.length ? pedidos.map((o) => `<div class="order-card" style="margin-bottom:14px"><div class="order-top"><div><p class="eyebrow">${folio(o.id_venta)}</p><strong>${money(o.total)}</strong><p class="muted">${esc(o.nombre_recibe || "")} · ${esc(o.ciudad_envio || "")}</p></div><span class="status">${esc(o.estado)}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><select data-est="${o.id_venta}" style="max-width:200px">${ESTADOS.map((s) => `<option ${s === o.estado ? "selected" : ""}>${s}</option>`).join("")}</select><input data-cod="${o.id_venta}" placeholder="Código de seguimiento" style="max-width:220px"><button class="small-button" data-ok="${o.id_venta}">Actualizar</button></div></div>`).join("") : '<p class="muted">Aún no hay pedidos.</p>';
    $("#pedidos").querySelectorAll("[data-ok]").forEach((b) => b.onclick = async () => {
      const id = b.dataset.ok;
      const estado = $("#pedidos").querySelector(`[data-est="${id}"]`).value;
      const codigo = $("#pedidos").querySelector(`[data-cod="${id}"]`).value.trim() || null;
      try { await api("/admin/pedidos/" + id + "/estado", { method: "PUT", body: JSON.stringify({ estado, codigo_seguimiento: codigo, nota: "" }) }); aviso("Pedido actualizado."); cargarPedidos(); cargarResumen(); }
      catch (err) { aviso(err.message, true); }
    });
  } catch (e) { $("#pedidos").innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}
</script></body></html>
