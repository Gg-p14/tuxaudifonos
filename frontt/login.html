<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | TuxAudifonos</title><link rel="stylesheet" href="/static/shop.css"></head><body><header class="navbar"><a class="brand" href="/"><span class="brand-mark">t</span> tuxaudifonos</a><nav class="main-nav"><a href="/">Audífonos</a><a href="/carrito">Carrito</a></nav></header><main class="shop-main" style="max-width:560px"><div class="shop-head"><p class="eyebrow">QUÉ BUENO TENERTE DE VUELTA</p><h1>Inicia sesión.</h1><p class="muted">Accede a tu perfil y consulta tus compras.</p></div><div id="message" class="notice hidden"></div><form id="login-form" class="shop-panel"><div class="form-grid"><div class="field full"><label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" required autocomplete="email" placeholder="tu@correo.com"></div><div class="field full"><label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password" minlength="8"></div></div><button class="primary-button" type="submit">Iniciar sesión</button><p class="muted">¿Todavía no tienes cuenta? <a href="/registro" style="color:#3478f6">Crear cuenta</a></p></form></main>
<script>
const msg = document.getElementById('message');
const siguiente = (() => { const n = new URLSearchParams(location.search).get('next') || '/'; return n.startsWith('/') && !n.startsWith('//') ? n : '/'; })();
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = e.target.querySelector('button'); b.disabled = true;
  try {
    const r = await fetch('/api/auth/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(Array.isArray(d.detail) ? d.detail.map(x => x.msg).join('. ') : (d.detail || 'No se pudo iniciar sesión.'));
    location.href = siguiente;
  } catch (err) { msg.textContent = err.message; msg.className = 'notice'; b.disabled = false; }
});
</script></body></html>
